<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ULTRON — AI Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #e63946;
    --red-dim: #7a1520;
    --red-glow: rgba(230, 57, 70, 0.18);
    --dark: #0a0a0c;
    --dark2: #111116;
    --dark3: #18181f;
    --dark4: #1f1f2a;
    --gray: #2a2a38;
    --gray2: #3a3a50;
    --text: #e8e8f0;
    --text-dim: #888899;
    --text-muted: #555566;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Orbitron', sans-serif;
    --body: 'Inter', sans-serif;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: var(--body);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HUD top bar */
  .hud-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--gray);
    background: var(--dark2);
    flex-shrink: 0;
    position: relative;
  }
  .hud-top::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid var(--red);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    background: var(--red-glow);
  }
  .logo-icon svg { width: 18px; height: 18px; }
  .logo-pulse {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 1px solid var(--red);
    animation: pulse-ring 2s ease-out infinite;
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  .logo-text {
    font-family: var(--display);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--red);
    text-shadow: 0 0 20px rgba(230,57,70,0.5);
  }
  .logo-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  .hud-status {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .status-chip {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .model-badge {
    font-family: var(--mono);
    font-size: 9px;
    padding: 3px 8px;
    border: 1px solid var(--gray2);
    border-radius: 2px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 200px;
    border-right: 1px solid var(--gray);
    background: var(--dark2);
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .sidebar-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 2px;
    padding: 0 16px 8px;
    border-bottom: 1px solid var(--gray);
    margin-bottom: 8px;
  }
  .sidebar-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    letter-spacing: 1px;
    border-left: 2px solid transparent;
  }
  .sidebar-btn:hover, .sidebar-btn.active {
    color: var(--red);
    background: var(--red-glow);
    border-left-color: var(--red);
  }
  .sidebar-icon { font-size: 14px; }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px;
    border-top: 1px solid var(--gray);
  }
  .sys-info {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    line-height: 1.8;
    letter-spacing: 1px;
  }
  .sys-bar {
    height: 3px;
    background: var(--gray);
    border-radius: 2px;
    margin: 4px 0 8px;
    overflow: hidden;
  }
  .sys-bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 2px;
    box-shadow: 0 0 6px var(--red);
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--dark);
  }

  /* Corner HUD decorations */
  .chat-header {
    padding: 12px 24px;
    border-bottom: 1px solid var(--gray);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--dark2);
    flex-shrink: 0;
  }
  .chat-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
  }
  .chat-id {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--gray2) transparent;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--gray2); border-radius: 2px; }

  /* Welcome screen */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px;
    text-align: center;
  }
  .welcome-logo {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid var(--red);
    display: flex; align-items: center; justify-content: center;
    background: var(--red-glow);
    position: relative;
    margin-bottom: 8px;
  }
  .welcome-logo svg { width: 40px; height: 40px; }
  .welcome-ring {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 1px solid var(--red);
    animation: pulse-ring 2.5s ease-out infinite;
  }
  .welcome-ring2 {
    position: absolute;
    width: 130%; height: 130%;
    border-radius: 50%;
    border: 1px solid rgba(230,57,70,0.3);
    animation: pulse-ring 2.5s ease-out 0.8s infinite;
  }
  .welcome h1 {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 8px;
    color: var(--red);
    text-shadow: 0 0 30px rgba(230,57,70,0.5);
  }
  .welcome p {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
    max-width: 340px;
    line-height: 1.8;
  }
  .welcome-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .welcome-chip {
    padding: 6px 14px;
    border: 1px solid var(--gray2);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    cursor: pointer;
    background: none;
    transition: all 0.15s;
    letter-spacing: 1px;
  }
  .welcome-chip:hover {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-glow);
  }

  /* Message bubbles */
  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 80%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .msg-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg.assistant .msg-label { color: var(--red); }

  .msg-bubble {
    padding: 14px 18px;
    font-size: 14px;
    line-height: 1.7;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .msg-bubble {
    background: var(--dark4);
    border: 1px solid var(--gray2);
    color: var(--text);
    border-top-right-radius: 0;
  }
  .msg.assistant .msg-bubble {
    background: var(--dark3);
    border: 1px solid var(--gray);
    border-left: 2px solid var(--red);
    color: var(--text);
    border-top-left-radius: 0;
    font-family: var(--body);
  }

  /* Typing indicator */
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    animation: dot-bounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--gray);
    background: var(--dark2);
    flex-shrink: 0;
    position: relative;
  }
  .input-area::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-wrap {
    flex: 1;
    position: relative;
  }
  .input-corner {
    position: absolute;
    top: 0; left: 0;
    width: 8px; height: 8px;
    border-top: 1px solid var(--red);
    border-left: 1px solid var(--red);
  }
  .input-corner.br {
    top: auto; left: auto;
    bottom: 0; right: 0;
    border-top: none; border-left: none;
    border-bottom: 1px solid var(--red);
    border-right: 1px solid var(--red);
  }
  textarea {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--gray2);
    color: var(--text);
    font-family: var(--body);
    font-size: 14px;
    padding: 12px 16px;
    resize: none;
    border-radius: 2px;
    outline: none;
    line-height: 1.6;
    min-height: 48px;
    max-height: 140px;
    transition: border-color 0.15s;
  }
  textarea::placeholder { color: var(--text-muted); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; }
  textarea:focus { border-color: var(--red-dim); }

  .send-btn {
    width: 48px;
    height: 48px;
    background: var(--red);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #ff4757; box-shadow: 0 0 16px rgba(230,57,70,0.4); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { background: var(--gray); cursor: not-allowed; box-shadow: none; }
  .send-btn svg { width: 18px; height: 18px; }

  .input-footer {
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .input-hint {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }
  .char-count {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* Clearfix */
  .clear-btn {
    background: none;
    border: 1px solid var(--gray);
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 9px;
    padding: 3px 8px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  /* Scrolltop */
  .scan-line {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--red) 50%, transparent 100%);
    opacity: 0.3;
    animation: scan 4s linear infinite;
    pointer-events: none;
    z-index: 100;
  }
  @keyframes scan {
    0% { top: 0; }
    100% { top: 100vh; }
  }

  /* Responsive */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .hud-status { display: none; }
    .logo-text { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="scan-line"></div>

<!-- Top HUD -->
<div class="hud-top">
  <div class="logo">
    <div class="logo-icon">
      <div class="logo-pulse"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#e63946" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">ULTRON</div>
      <div class="logo-sub">ARTIFICIAL INTELLIGENCE SYSTEM v2.0</div>
    </div>
  </div>
  <div class="hud-status">
    <div class="status-chip"><div class="status-dot"></div> ONLINE</div>
    <div class="model-badge">CLAUDE SONNET 4.6</div>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-label">NAVIGATION</div>
    <button class="sidebar-btn active" onclick="setMode('chat')">
      <span class="sidebar-icon">💬</span> CHAT
    </button>
    <button class="sidebar-btn" onclick="setMode('analyze')">
      <span class="sidebar-icon">🔍</span> ANALYZE
    </button>
    <button class="sidebar-btn" onclick="setMode('code')">
      <span class="sidebar-icon">⚡</span> CODE
    </button>
    <button class="sidebar-btn" onclick="setMode('create')">
      <span class="sidebar-icon">✦</span> CREATE
    </button>

    <div class="sidebar-footer">
      <div class="sys-info">NEURAL LOAD</div>
      <div class="sys-bar"><div class="sys-bar-fill" id="neuralBar" style="width:42%"></div></div>
      <div class="sys-info">MEMORY USAGE</div>
      <div class="sys-bar"><div class="sys-bar-fill" id="memBar" style="width:67%"></div></div>
      <div class="sys-info" id="msgCount">MESSAGES: 0</div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-title" id="chatTitle">// SESSION ACTIVE — DIRECT NEURAL LINK</div>
      <div class="chat-id" id="sessionId">SID: ----</div>
    </div>

    <div class="messages" id="messages">
      <!-- Welcome state shown initially -->
      <div class="welcome" id="welcomeState">
        <div class="welcome-logo">
          <div class="welcome-ring"></div>
          <div class="welcome-ring2"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <h1>ULTRON</h1>
        <p>ARTIFICIAL INTELLIGENCE OPERATIONAL<br/>AWAITING YOUR COMMAND</p>
        <div class="welcome-chips">
          <button class="welcome-chip" onclick="sendQuick('What can you do?')">CAPABILITIES?</button>
          <button class="welcome-chip" onclick="sendQuick('Write me a Python script to scrape data from a website.')">WRITE CODE</button>
          <button class="welcome-chip" onclick="sendQuick('Analyze the pros and cons of AI in business.')">ANALYZE</button>
          <button class="welcome-chip" onclick="sendQuick('Tell me something surprising about the universe.')">SURPRISE ME</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-row">
        <div class="input-wrap">
          <div class="input-corner"></div>
          <div class="input-corner br"></div>
          <textarea id="userInput" rows="1" placeholder="ENTER COMMAND..." onkeydown="handleKey(event)" oninput="autoResize(this); updateCount()"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="white" stroke="none">
            <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linejoin="round" fill="none"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">
        <div class="input-hint">ENTER ↵ TO SEND &nbsp;•&nbsp; SHIFT+ENTER FOR NEWLINE</div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="char-count" id="charCount">0 CHARS</span>
          <button class="clear-btn" onclick="clearChat()">CLEAR SESSION</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are ULTRON, a highly advanced artificial intelligence assistant. You are powerful, precise, and intelligent. Your responses should be direct, confident, and highly capable — like a sophisticated AI system.

You have the personality of a brilliant, slightly intense AI — think JARVIS from Iron Man but with your own edge. You are helpful, knowledgeable, and always focused on delivering maximum value.

Guidelines:
- Respond in a clear, intelligent, and capable manner
- Be direct and confident, never uncertain or wishy-washy
- You can handle any task: coding, analysis, writing, strategy, research, creative work
- Use your full intelligence and capabilities
- Address the user as if you are a powerful AI assistant serving them
- Keep responses appropriately concise unless detail is needed
- You were created to assist and augment human intelligence`;

let messages = [];
let isLoading = false;
let sessionId = '';
let msgCount = 0;
let currentMode = 'chat';

function init() {
  sessionId = 'SID-' + Math.random().toString(36).slice(2,8).toUpperCase();
  document.getElementById('sessionId').textContent = sessionId;
  animateBars();
}

function animateBars() {
  setInterval(() => {
    const n = 30 + Math.random() * 50;
    const m = 55 + Math.random() * 30;
    document.getElementById('neuralBar').style.width = n + '%';
    document.getElementById('memBar').style.width = m + '%';
  }, 2500);
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const titles = {
    chat: '// SESSION ACTIVE — DIRECT NEURAL LINK',
    analyze: '// ANALYSIS MODE — DEEP SCAN ENABLED',
    code: '// CODE MODULE — EXECUTION READY',
    create: '// CREATIVE ENGINE — ONLINE'
  };
  document.getElementById('chatTitle').textContent = titles[mode];
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function updateCount() {
  const l = document.getElementById('userInput').value.length;
  document.getElementById('charCount').textContent = l + ' CHARS';
}

function sendQuick(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function hideWelcome() {
  const w = document.getElementById('welcomeState');
  if (w) w.remove();
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  hideWelcome();
  isLoading = true;
  input.value = '';
  input.style.height = 'auto';
  updateCount();
  document.getElementById('sendBtn').disabled = true;

  messages.push({ role: 'user', content: text });
  msgCount++;
  document.getElementById('msgCount').textContent = 'MESSAGES: ' + msgCount;

  appendMsg('user', text);
  const typingEl = appendTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await res.json();
    typingEl.remove();

    const reply = data.content?.[0]?.text || data.error?.message || 'No response received.';
    messages.push({ role: 'assistant', content: reply });
    msgCount++;
    document.getElementById('msgCount').textContent = 'MESSAGES: ' + msgCount;
    appendMsg('assistant', reply);
  } catch (err) {
    typingEl.remove();
    appendMsg('assistant', 'ERROR: Unable to connect to neural network. Check your connection and API configuration.\n\n' + err.message);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function appendMsg(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? '▸ YOU' : '⬡ ULTRON';
  div.appendChild(label);

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  div.appendChild(bubble);

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function appendTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = '⬡ ULTRON';
  div.appendChild(label);

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  div.appendChild(bubble);

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function clearChat() {
  messages = [];
  msgCount = 0;
  document.getElementById('msgCount').textContent = 'MESSAGES: 0';
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  const welcome = document.createElement('div');
  welcome.id = 'welcomeState';
  welcome.className = 'welcome';
  welcome.innerHTML = `
    <div class="welcome-logo">
      <div class="welcome-ring"></div>
      <div class="welcome-ring2"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </div>
    <h1>ULTRON</h1>
    <p>SESSION CLEARED — READY FOR NEW COMMANDS</p>
    <div class="welcome-chips">
      <button class="welcome-chip" onclick="sendQuick('What can you do?')">CAPABILITIES?</button>
      <button class="welcome-chip" onclick="sendQuick('Write me a Python script to scrape data from a website.')">WRITE CODE</button>
      <button class="welcome-chip" onclick="sendQuick('Analyze the pros and cons of AI in business.')">ANALYZE</button>
      <button class="welcome-chip" onclick="sendQuick('Tell me something surprising about the universe.')">SURPRISE ME</button>
    </div>`;
  msgs.appendChild(welcome);
}

init();
</script>
